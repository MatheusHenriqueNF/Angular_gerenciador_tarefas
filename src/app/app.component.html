<main><h1>Minhas tarefas</h1><p class="muted">Organize atividades e acompanhe seu progresso.</p>
<section class="panel"><form class="row" (ngSubmit)="add()"><input name="task" [(ngModel)]="newTitle" placeholder="Ex.: Estudar Angular" aria-label="Nova tarefa"><button type="submit">Adicionar</button></form>
<div class="stats" style="margin-top:20px"><div class="stat"><strong>{{ tasks().length }}</strong>Total</div><div class="stat"><strong>{{ completed() }}</strong>Concluídas</div><div class="stat"><strong>{{ tasks().length - completed() }}</strong>Pendentes</div></div></section>
<section class="panel"><div class="row"><strong style="margin-right:auto">Lista de tarefas</strong><label for="filter">Exibir</label><select id="filter" [ngModel]="filter()" (ngModelChange)="filter.set($event)"><option value="all">Todas</option><option value="pending">Pendentes</option><option value="done">Concluídas</option></select></div>
@for (task of visibleTasks(); track task.id) {<div class="item"><label class="row" style="margin:0;flex:1"><input type="checkbox" style="flex:0" [checked]="task.done" (change)="toggle(task.id)"><span [class.done]="task.done">{{task.title}}</span></label><button class="danger" type="button" (click)="remove(task.id)" [attr.aria-label]="'Excluir '+task.title">Excluir</button></div>} @empty {<p class="muted">Nenhuma tarefa para este filtro.</p>}</section></main>
